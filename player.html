<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title="site.title.player">Pemutar — BH Video</title>
  <link rel="stylesheet" href="styles.css?v=20261029" />
  <script src="i18n.js?v=20261029"></script>
</head>
<body class="player-page">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">▶</span>
        <span class="logo-text">BH<span class="accent">Video</span></span>
      </a>
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span data-i18n="nav.back">Kembali ke Beranda</span>
      </a>

      <div class="lang-switcher-host" data-lang-switcher></div>
    </div>
  </header>

  <main class="container player-layout">
    <!-- Main player area -->
    <section class="player-main">
      <div class="player-shell">
        <video id="videoPlayer" controls playsinline preload="metadata">
          <!-- src injected by player.js -->
          <span data-i18n="player.unsupported">Browser Anda tidak mendukung tag video.</span>
        </video>
      </div>

      <div class="player-meta">
        <h1 id="videoTitle" data-i18n="player.loading">Memuat…</h1>

        <div class="meta-row">
          <div class="meta-stats">
            <span id="videoViews"></span>
            <span class="dot">•</span>
            <span id="videoEpCount"></span>
            <span class="dot">•</span>
            <span id="videoCategory"></span>
          </div>

          <div class="actions">
            <button class="action-btn" id="likeBtn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"></path>
                <line x1="7" y1="22" x2="7" y2="11"></line>
              </svg>
              <span data-i18n="player.like">Suka</span>
            </button>
            <button class="action-btn" id="shareBtn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
              <span data-i18n="player.share">Bagikan</span>
            </button>
          </div>
        </div>

        <div class="player-tags" id="videoTags"></div>

        <p class="description" id="videoDescription"></p>
      </div>
    </section>

    <!-- Episode list sidebar -->
    <aside class="up-next">
      <h2 class="section-title" id="upNextTitle" data-i18n="player.episodes">Daftar Episode</h2>
      <div id="upNextList" class="up-next-list">
        <!-- Filled by player.js -->
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.player">© 2025 BH Video — Platform demo video sesuai permintaan.</p>
    </div>
  </footer>

  <script src="videos.js?v=20261029"></script>
  <script src="player.js?v=20261029"></script>
  <script src="ads.js?v=20261029"></script>
</body>
</html>
