<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n-title="site.title.player">Pemutar — BH Video</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ff2d55'/%3E%3Cpolygon points='24,18 48,32 24,46' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=20261037" />
  <script src="i18n.js?v=20261037"></script>
</head>
<body class="player-page player-feed-page">
  <!-- Floating top-left: back to home (mirrors the home-page overlay). -->
  <a href="index.html" class="feed-top-back" aria-label="Kembali ke Beranda">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Kembali</span>
  </a>

  <!-- Full-screen vertical feed. Each snap item = ONE episode of
       the same series; swipe up/down to switch episodes. -->
  <main class="player-feed">
    <div id="feed" class="feed-container" role="list"></div>
    <div id="feedEmpty" class="feed-empty" hidden>
      <div class="feed-empty-icon">🎬</div>
    <div class="feed-empty-text" data-i18n="player.notFound.title">Video tidak ditemukan</div>
    </div>
  </main>

  <!-- Hidden single-video shell: kept so legacy references in ads.js /
       error overlay don't throw. The real players live inside each
       feed card and are managed by player.js. -->
  <div class="player-legacy-hidden" aria-hidden="true" hidden>
    <video id="videoPlayer" playsinline preload="none"></video>
    <h1 id="videoTitle"></h1>
    <span id="videoViews"></span>
    <span id="videoEpCount"></span>
    <span id="videoCategory"></span>
    <div id="videoTags"></div>
    <p id="videoDescription"></p>
    <div id="upNextList"></div>
    <h2 id="upNextTitle"></h2>
    <button id="likeBtn"></button>
    <button id="shareBtn"></button>
  </div>

  <script src="videos.js?v=20261038"></script>
  <script src="player.js?v=20261038"></script>
  <script src="ads.js?v=20261038"></script>
</body>
</html>
