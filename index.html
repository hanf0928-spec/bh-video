<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title data-i18n-title="site.title.home">BH Video — Tonton di Mana Saja</title>
  <link rel="stylesheet" href="styles.css?v=20261029" />
  <script src="i18n.js?v=20261029"></script>
</head>
<body class="feed-page">
  <!-- Floating top overlay: logo + search + language switcher -->
  <div class="feed-topbar">
    <a href="index.html" class="feed-logo">
      <span class="logo-mark">▶</span>
      <span class="logo-text">BH<span class="accent">Video</span></span>
    </a>

    <div class="feed-topbar-right">
      <button id="feedSearchBtn" class="feed-icon-btn" type="button"
              data-i18n-attr="aria-label:header.search.aria">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <div class="lang-switcher-host" data-lang-switcher></div>
    </div>
  </div>

  <!-- Search panel (hidden by default, slides down when the magnifier is tapped) -->
  <div id="feedSearchPanel" class="feed-search-panel" hidden>
    <input id="searchInput" type="text"
           data-i18n-attr="placeholder:header.search.placeholder" />
    <button id="searchBtn" type="button"
            data-i18n-attr="aria-label:header.search.aria">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
    <div id="searchResults" class="feed-search-results"></div>
  </div>

  <!-- Vertical immersive feed: one series per full-viewport card -->
  <main id="feed" class="feed-container">
    <!-- Filled by app.js. Each child is .feed-item (100vw × 100vh). -->
  </main>

  <!-- Empty / loading state -->
  <div id="feedEmpty" class="feed-empty" hidden>
    <div class="feed-empty-icon">🎬</div>
    <p data-i18n="home.empty">Tidak ada video.</p>
  </div>

  <script src="videos.js?v=20261029"></script>
  <script src="app.js?v=20261029"></script>
  <script src="ads.js?v=20261029"></script>
</body>
</html>
