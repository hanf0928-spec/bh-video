#
# BH Video — Nginx reverse proxy for Tencent Cloud CDN origin.
#
# ============================================================
# Deployment picture
# ============================================================
#   User → HTTPS/443 → CDN edge → HTTP/80 (回源) → this Nginx
#                                                     ↓
#                                             127.0.0.1:8765
#                                             (Python server.py)
#
# Ports exposed by this host (to the public internet via the
# cloud-provider's security group):
#   • 80/TCP   — accepts HTTP traffic from CDN origin IPs
#   • 443/TCP  — optional; only needed if CDN is configured to
#                use HTTPS as the "回源协议" (recommended for
#                security; required for Admin dashboard where
#                we send bearer tokens)
#   • 22/TCP   — SSH, restrict to your office IP
#
# Ports that MUST stay internal (loopback):
#   • 8765/TCP — Python backend
#
# ============================================================
# What this template does
# ============================================================
#   1. Pulls the REAL client IP out of X-Forwarded-For (CDN
#      sets it) so the backend's UV / IP-based dedup still work.
#   2. Marks static assets as cacheable at the edge (1 day).
#   3. Marks every /api/* response as uncacheable at the edge
#      (telemetry + admin APIs must never be served stale).
#   4. Optionally rejects non-CDN direct hits (uncomment the
#      geo{} + "deny all" block near the bottom).
#
# Replace YOUR_DOMAIN below with your CDN origin host (usually
# the SAME domain users type, e.g. video.example.com), then
# symlink into /etc/nginx/sites-enabled/ (Debian) OR drop into
# /etc/nginx/conf.d/ (CentOS / OpenCloudOS) and reload.
#

# -----------------------------------------------------------
# Trust the X-Forwarded-For header coming from Tencent Cloud
# CDN edges so $remote_addr == real end-user IP.
# You can regenerate this list from the CDN console or stick
# to the current public ranges; keep it in sync.
# -----------------------------------------------------------
set_real_ip_from  101.226.0.0/16;
set_real_ip_from  119.147.0.0/16;
set_real_ip_from  120.198.0.0/16;
set_real_ip_from  180.153.0.0/16;
set_real_ip_from  183.60.0.0/16;
set_real_ip_from  36.248.0.0/16;
set_real_ip_from  58.250.0.0/16;
set_real_ip_from  10.0.0.0/8;        # internal
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# -----------------------------------------------------------
# HTTPS endpoint (CDN "回源协议 = HTTPS")
# -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # certbot --nginx -d YOUR_DOMAIN will populate these.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    # Pass identity down to the Python backend.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---------- /api/* : NEVER cache at the edge ----------
    # Telemetry counters and the admin dashboard must always
    # hit the origin. These headers override whatever default
    # TTL the CDN is configured with.
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma         "no-cache"                           always;
        # Tell Tencent CDN specifically to skip caching.
        add_header X-Accel-Expires "0"                                  always;
    }

    # ---------- Static assets : cacheable at the edge ----------
    # Our HTML files include ?v=YYYYMMDD cache busters, so
    # a 7-day TTL is safe. First byte from a cold edge still
    # proxies through — subsequent hits are served from the
    # CDN POP without touching this origin.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?|ico)$ {
        proxy_pass http://127.0.0.1:8765;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---------- HTML : cache for a short time ----------
    # HTML gets a short TTL (5 min) so you can roll out a new
    # ?v= bust and have it picked up quickly without a full
    # CDN purge.
    location ~* \.html$ {
        proxy_pass http://127.0.0.1:8765;
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ---------- Default : passthrough ----------
    location / {
        proxy_pass http://127.0.0.1:8765;
    }
}

# -----------------------------------------------------------
# HTTP endpoint — only needed if your CDN is still using
# HTTP as 回源协议, OR to serve the Let's Encrypt renewal
# challenge. Can be removed once CDN is pinned to HTTPS.
# -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 16m;

    # Same proxy headers as the HTTPS block above.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ACME challenge location — keep in HTTP so certbot can
    # renew without CDN interference.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Passthrough everything else to the Python backend.
    # If CDN 回源协议 = HTTPS you can replace this block with
    # a 301 redirect to the HTTPS endpoint:
    #     return 301 https://$host$request_uri;
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
    }
}

