#
# BH Video — Nginx reverse proxy template.
#
# Replace YOUR_DOMAIN below with your real domain (e.g. video.example.com),
# then symlink this file into /etc/nginx/sites-enabled/ and reload Nginx.
# For HTTPS, run `certbot --nginx -d YOUR_DOMAIN` AFTER this file is in place.
#

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Allow larger uploads (JSON imports, COS preview replies).
    client_max_body_size 8m;

    # Pass the real client IP so the backend's visits.json records
    # correct daily UVs (otherwise every hit would look like 127.0.0.1).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-poll friendly timeouts (safe default: 60s).
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location / {
        proxy_pass http://127.0.0.1:8765;
    }

    # Optional: cache the pure static assets for a day. The Python backend
    # already sets no-store on API responses, so these rules only ever hit
    # real static files.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        proxy_pass http://127.0.0.1:8765;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
